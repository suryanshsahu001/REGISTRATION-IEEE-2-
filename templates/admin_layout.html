<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - MEDHA 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-body">
    <div class="admin-wrapper">
        <!-- Sidebar -->
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="sidebar-header">
                <h2>MEDHA 2026</h2>
                <p>Admin Panel</p>
            </div>
            
            <nav class="sidebar-nav">
                <a href="{{ url_for('admin_dashboard') }}" class="nav-item"><i class="fas fa-home"></i> Dashboard</a>
                <a href="{{ url_for('admin_students') }}" class="nav-item"><i class="fas fa-user-graduate"></i> Students</a>
                <a href="{{ url_for('admin_teams') }}" class="nav-item"><i class="fas fa-users"></i> Teams</a>
                <a href="{{ url_for('admin_audit') }}" class="nav-item"><i class="fas fa-clipboard-list"></i> Audit Logs</a>
                <a href="#" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
                <a href="{{ url_for('admin_logout') }}" class="nav-item logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <div class="admin-main">
            <header class="admin-header">
                <button class="mobile-sidebar-btn" id="mobileSidebarBtn">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="admin-user-info">
                    <span><i class="fas fa-user-shield"></i> {{ current_user.name }}</span>
                    <a href="{{ url_for('admin_logout') }}" class="btn btn-outline btn-sm" style="margin-left:1rem; color:var(--danger-color); border-color:var(--danger-color);">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </div>
            </header>

            <main class="admin-content-area">
                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        <div class="flash-messages">
                            {% for message in messages %}
                                <div class="alert alert-info">{{ message }}</div>
                            {% endfor %}
                        </div>
                    {% endif %}
                {% endwith %}
                
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
