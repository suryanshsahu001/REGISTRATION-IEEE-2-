{% extends "admin_layout.html" %}

{% block content %}
<div class="admin-page-header">
    <h1>All Students</h1>
    <div class="header-actions">
        <a href="{{ url_for('export_students') }}" class="btn btn-outline btn-sm"><i class="fas fa-download"></i> Export CSV</a>
    </div>
</div>

<div class="admin-controls glass-card">
    <div class="search-filter-form">
        <div class="search-box">
            <input type="text" id="studentSearch" placeholder="Search by name, email, college, team ID...">
        </div>
        
        <div class="filter-box">
            <label for="studentFilter">Filter:</label>
            <select id="studentFilter">
                <option value="all">All Students</option>
                <option value="with_team">With Team</option>
                <option value="without_team">Without Team</option>
                <option value="leaders">Team Leaders</option>
                <option value="members">Team Members</option>
                <option value="complete_teams">In Complete Teams</option>
                <option value="incomplete_teams">In Incomplete Teams</option>
                <option value="registered_teams">In Registered Teams</option>
            </select>
        </div>
    </div>
</div>

<div class="table-container glass-card">
    <table class="admin-table" id="studentsTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Contact</th>
                <th>College & Dept</th>
                <th>Team Info</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="studentsTableBody">
            <!-- Populated via JS -->
            <tr><td colspan="5" class="text-center">Loading students...</td></tr>
        </tbody>
    </table>
</div>

<!-- Edit Student Modal -->
<div id="editStudentModal" class="modal">
    <div class="modal-content glass-card">
        <span class="close-modal">&times;</span>
        <h3>Edit Student Details</h3>
        
        <form id="editStudentForm" class="auth-form" style="max-height: 70vh; overflow-y: auto; padding-right: 10px;">
            <input type="hidden" id="edit-id">
            
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="edit-name" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="edit-email" required>
            </div>
            <div class="form-group">
                <label>Mobile</label>
                <input type="tel" id="edit-mobile" required>
            </div>
            <div class="form-group">
                <label>College</label>
                <input type="text" id="edit-college" required>
            </div>
            <div class="form-group">
                <label>Department</label>
                <input type="text" id="edit-department" required>
            </div>
            <div class="form-group">
                <label>Year</label>
                <select id="edit-year">
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                    <option value="4th Year">4th Year</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>Skills</label>
                <input type="text" id="edit-skills">
            </div>
            <div class="form-group">
                <label>GitHub URL</label>
                <input type="url" id="edit-github">
            </div>
            <div class="form-group">
                <label>LinkedIn URL</label>
                <input type="url" id="edit-linkedin">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}
